<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título y SEO -->
  <title>Contacto - Lohana Acosta</title>
  <meta name="description" content="Contactá a Lohana Acosta para consultas sobre planes de entrenamiento o seguimiento personalizado." />
  <meta name="keywords" content="contacto, redes sociales, Lohana Acosta, email, consultas" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- AOS CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

  <!-- Tu CSS -->
  <link rel="stylesheet" href="../styles/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="../index.html">
          <img src="../assets/logo.png" alt="Logo Lohana Acosta" height="40" />
          <span class="fw-bold ms-2">Lohana Acosta</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#miNavbar">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="miNavbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="sobre_mi.html">Sobre Mí</a></li>
            <li class="nav-item"><a class="nav-link" href="planes.html">Planes</a></li>
            <li class="nav-item"><a class="nav-link" href="contactos_y_redes.html">Contacto</a></li>
            <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="container my-5">
    <h1 class="text-center mb-4" data-aos="fade-up">Contacto</h1>
    <div class="row" data-aos="fade-up" data-aos-delay="200">
      <div class="col-md-6">
        <form>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="tu@email.com" />
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="4"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
      </div>
      <div class="col-md-6">
        <h5>Redes Sociales</h5>
        <ul>
          <li><a href="#">Instagram</a></li>
          <li><a href="#">Facebook</a></li>
          <li><a href="#">YouTube</a></li>
        </ul>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="text-center py-4">
    <p>&copy; 2026 Lohana Acosta - Todos los derechos reservados.</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- AOS JS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 1000,
      once: true,
    });
  </script>
</body>
</html>
